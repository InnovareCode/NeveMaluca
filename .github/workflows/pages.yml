# Deploy do Neve Maluca no GitHub Pages (site de teste do dono, decisao D8).
# O projeto ja e Pages-ready: a CSP vai por <meta> (o Pages nao aceita header, ver vite.config.ts) e o subcaminho
# entra por --base. URL final: https://innovarecode.github.io/NeveMaluca/
# NOTA (Vulcano/Dependabot): as actions especificas de Pages abaixo estao por TAG; pinar por SHA depois, como no ci.yml.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; nao cancela o que esta no ar (pra nao deixar o site meio-publicado).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build (--base=/NeveMaluca/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/NeveMaluca/
      - uses: actions/upload-pages-artifact@v3 # TODO: pinar por SHA (como no ci.yml)
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4 # TODO: pinar por SHA
